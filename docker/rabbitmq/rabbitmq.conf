# ScanDrix RabbitMQ broker configuration.
#
# AUDIT_REMEDIATION.md F-52
#
# This file previously contained:
#
#   default_user = scandrix_admin
#   default_pass = scandrix_mq_password
#
# Those are real, working credentials committed to the repository and baked
# into the image. Worse, they silently defeated the deployment guard in
# docker-compose.yml, which uses ${RABBITMQ_PASSWORD:?...} to refuse to start
# without a password: RabbitMQ only honours RABBITMQ_DEFAULT_USER / _PASS from
# the environment when the config file does not set default_user / default_pass,
# so the :? check passed while the broker kept using the committed secret.
#
# Credentials now come only from the environment (RABBITMQ_DEFAULT_USER and
# RABBITMQ_DEFAULT_PASS), which the compose file requires explicitly.
default_vhost = /
management.tcp.port = 15672
prometheus.tcp.port = 15692
vm_memory_high_watermark.relative = 0.8
