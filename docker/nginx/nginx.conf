events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging format with upstream timing
    log_format cluster_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'upstream: $upstream_addr ($upstream_response_time s)';

    access_log /var/log/nginx/access.log cluster_log;
    error_log /var/log/nginx/error.log warn;

    # Global Rate Limiting Zone (Master Rule 4.5)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # Upstream Pool: Load Balancing across Server 1 & Server 2
    upstream scandrix_cluster {
        # Round-Robin with passive health checks
        server scandrix-api-1:8080 max_fails=3 fail_timeout=10s;
        server scandrix-api-2:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Health check endpoint for the load balancer itself
        location /lb-health {
            access_log off;
            default_type text/plain;
            return 200 "ScanDrix NGINX Load Balancer Healthy\n";
        }

        # Main API & Webhook Ingress
        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://scandrix_cluster;
            proxy_http_version 1.1;

            # HTTP Keep-Alive connection to upstream Go servers
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running review streams
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Security Headers (Enterprise Baseline 5.4)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
