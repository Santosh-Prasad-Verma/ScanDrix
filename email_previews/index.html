<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanDrix Email Templates Gallery · Ambient Gradients</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #060710; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 340px; background: #0b0f19; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
    .header { padding: 20px 24px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
    .logo-text { font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 9999px; background: rgba(99, 102, 241, 0.15); color: #c7d2fe; font-weight: 700; border: 1px solid rgba(99, 102, 241, 0.35); text-transform: uppercase; letter-spacing: 0.05em; }
    .nav-list { list-style: none; overflow-y: auto; flex: 1; padding: 12px; }
    .nav-item { padding: 12px 16px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; transition: all 0.15s ease; border: 1px solid transparent; }
    .nav-item:hover { background: #111827; border-color: #1e293b; }
    .nav-item.active { background: #172554; border-color: #3b82f6; }
    .nav-item.active .nav-title { color: #ffffff; }
    .nav-item.active .nav-subject { color: #93c5fd; }
    .nav-title { font-size: 13.5px; font-weight: 600; color: #e2e8f0; margin-bottom: 3px; }
    .nav-subject { font-size: 11.5px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #main { flex: 1; display: flex; flex-direction: column; background: #060710; }
    #topbar { padding: 14px 24px; background: #0b0f19; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
    .topbar-info { display: flex; flex-direction: column; max-width: 60%; }
    .active-subject { font-size: 13.5px; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewport-controls { display: flex; gap: 8px; }
    .viewport-btn { background: #111827; border: 1px solid #1e293b; color: #94a3b8; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .viewport-btn.active, .viewport-btn:hover { color: #ffffff; background: #4f46e5; border-color: #6366f1; }
    #preview-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 24px; overflow: auto; background: radial-gradient(circle at 50% 20%, #0d1527 0%, #060710 80%); }
    #preview-frame { border: 1px solid #1e293b; border-radius: 12px; box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9); background: #060710; transition: width 0.2s ease; height: 100%; width: 100%; max-width: 620px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="header">
      <div class="logo-text">ScanDrix <span style="font-size: 12px; font-weight: 500; color: #94a3b8;">Emails</span></div>
      <div class="badge">Ambient Gradients</div>
    </div>
    <ul class="nav-list" id="nav-list"></ul>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="topbar-info">
        <span style="font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b;">Active Email Subject</span>
        <span class="active-subject" id="active-subject">...</span>
      </div>
      <div class="viewport-controls">
        <button class="viewport-btn active" onclick="setMode('desktop')">Desktop (620px)</button>
        <button class="viewport-btn" onclick="setMode('mobile')">Mobile (390px)</button>
        <button class="viewport-btn" onclick="openRaw()">Open HTML ↗</button>
      </div>
    </div>
    <div id="preview-container">
      <iframe id="preview-frame" src=""></iframe>
    </div>
  </div>

  <script>
    const emailData = [
      { id: "password_reset", name: "Password Reset (Drixy Thinking)", subject: "Reset your ScanDrix Password", file: "password_reset.html" },
      { id: "email_verification", name: "Email Verification (Drixy Waving)", subject: "Verify your email to activate ScanDrix", file: "email_verification.html" },
      { id: "user_welcome", name: "New User Welcome (Drixy Celebrating)", subject: "Welcome to ScanDrix — Let's secure your code! 🚀", file: "user_welcome.html" },
      { id: "subscription_welcome", name: "Subscription Welcome (Drixy Pro)", subject: "Welcome to ScanDrix Pro Team Plan! Your frontier AI models are now unlocked", file: "subscription_welcome.html" },
      { id: "pr_review_completed", name: "PR Review Completed (Drixy Reviewer)", subject: "Drixy Review: Approved on acme/auth-service #189", file: "pr_review_completed.html" },
      { id: "critical_vulnerability_alert", name: "Critical Security Alert (Drixy Alert)", subject: "[CRITICAL] Security Alert: Vulnerability found in acme/auth-service", file: "critical_vulnerability_alert.html" },
      { id: "team_invite", name: "Team Invitation (Drixy Floating)", subject: "Sarah Chen invited you to join Acme Security on ScanDrix", file: "team_invite.html" },
      { id: "weekly_digest", name: "Weekly Security Digest (Drixy Coffee)", subject: "Weekly Security Digest: Acme Labs · 58 PRs Reviewed, 16 Blocked", file: "weekly_digest.html" },
      { id: "invoice_receipt", name: "Invoice Receipt (Drixy Reading)", subject: "Your ScanDrix Invoice INV-2026-99218 (₹2,499.00 INR)", file: "invoice_receipt.html" },
      { id: "payment_failed", name: "Payment Failed Alert", subject: "Action Required: Payment failed for ScanDrix Acme Labs", file: "payment_failed.html" },
      { id: "spend_limit_alert", name: "Spend Limit Alert (85%)", subject: "Alert: Workspace Acme Labs has approaching its monthly token quota (85%)", file: "spend_limit_alert.html" },
      { id: "trial_expiring", name: "Trial Expiring Reminder (Drixy Waiting)", subject: "3 Days Remaining: Keep your ScanDrix security gates active", file: "trial_expiring.html" },
      { id: "new_device_login", name: "New Device Login Alert", subject: "Security Alert: New login to ScanDrix from Frankfurt, Germany", file: "new_device_login.html" },
      { id: "api_key_created", name: "Team API Key Created (Drixy Idea)", subject: "New Team API Key Created for Acme Labs", file: "api_key_created.html" },
      { id: "usage_threshold_80", name: "Usage Threshold Warning (80%)", subject: "Notice: Acme Labs has reached 80% of monthly review quota", file: "usage_threshold_80.html" },
      { id: "usage_threshold_100", name: "Usage Threshold Exceeded (100%)", subject: "Action Required: Acme Labs has exceeded monthly review quota (100%)", file: "usage_threshold_100.html" }
    ];

    let current = emailData[0];
    const navList = document.getElementById("nav-list");
    const frame = document.getElementById("preview-frame");
    const subjectEl = document.getElementById("active-subject");

    emailData.forEach((item, idx) => {
      const li = document.createElement("li");
      li.className = "nav-item" + (idx === 0 ? " active" : "");
      li.innerHTML = '<div class="nav-title">' + item.name + '</div><div class="nav-subject">' + item.subject + '</div>';
      li.onclick = () => selectEmail(item, li);
      navList.appendChild(li);
    });

    function selectEmail(item, el) {
      current = item;
      document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
      el.classList.add("active");
      subjectEl.textContent = item.subject;
      frame.src = item.file;
    }

    function setMode(mode) {
      document.querySelectorAll(".viewport-btn").forEach(b => b.classList.remove("active"));
      if (mode === "desktop") {
        frame.style.maxWidth = "620px";
        event.target.classList.add("active");
      } else if (mode === "mobile") {
        frame.style.maxWidth = "390px";
        event.target.classList.add("active");
      }
    }

    function openRaw() {
      if (current) window.open(current.file, "_blank");
    }

    selectEmail(emailData[0], navList.firstChild);
  </script>
</body>
</html>
