run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - noctx
    - nilerr

linters-settings:
  govet:
    enable-all: false
    disable:
      - fieldalignment
  errcheck:
    check-type-assertions: false
    check-blank: false
  gosec:
    excludes:
      - G101 # False positives on mock/test API keys
      - G204 # Subprocess launching in CLI/sandbox git commands
      - G306 # File permissions on test scripts/hooks
      - G107 # Dynamic HTTP request URLs in CLI updater/client

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - noctx
        - nilerr
    - linters:
        - nilerr
      text: "error is not nil"
