run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  govet:
    enable-all: false
    disable:
      - fieldalignment
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 10
