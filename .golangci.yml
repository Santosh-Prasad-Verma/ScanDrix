run:
  timeout: 5m
  go: "1.24"

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck

linters-settings:
  govet:
    enable-all: false
    disable:
      - fieldalignment
  errcheck:
    check-type-assertions: false
    check-blank: false
  staticcheck:
    checks:
      - "all"
      - "-SA1019" # Legacy adapters/third-party deprecations
      - "-SA1029" # Correlation ID string keys in HTTP interceptors
      - "-SA1012" # Nil context tests in chaos/utils

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go
      linters:
        - staticcheck
