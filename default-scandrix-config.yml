
version: 2.0

# ─────────────────────────────────────────────────────────────
# 1. CORE REVIEW LIFECYCLE & CADENCE
# ─────────────────────────────────────────────────────────────

# Enable automated code reviews on pull requests
automatedReviewActive: true

# Emit status feedback and review summary comments on SCM platforms
showStatusFeedback: true

# When enabled, repository-level configuration takes precedence over organization web dashboard
scandrixConfigFileOverridesWebPreferences: false

# Automated review cadence configuration:
#   type: 'automatic' | 'autopause' | 'manual'
#   timeWindow: quiet period window in minutes for batching rapid commits
#   pushesToTrigger: commit threshold before forcing a review pass
reviewCadence:
  type: 'automatic'
  timeWindow: 15
  pushesToTrigger: 3

# Automatically approve pull requests when no high/critical issues are detected
pullRequestApprovalActive: false

# Submit a formal Request Changes review when critical or high severity defects are detected
isRequestChangesActive: false

# Trigger review runs on Draft pull requests
runOnDraft: true

