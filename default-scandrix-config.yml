# Pull request title keywords that bypass automated review
ignoredTitleKeywords: []

# Target base branches to ignore
baseBranches: []

# Enable single-click committable suggestion diffs
enableCommittableSuggestions: true

# BYOK Model override (empty = inherit organization default)
byokModel: ''

# Cross-repository context graph links
linkedRepositories: []

# Active code review engine architecture version
codeReviewVersion: 'v2'

# ─────────────────────────────────────────────────────────────
# 3. REVIEW DOMAINS & SUGGESTION CONTROLS
# ─────────────────────────────────────────────────────────────

# Active inspection dimensions
reviewOptions:
  bug: true
  performance: true
  security: true
  business_logic: true

# Filter thresholds for generated suggestions
suggestionControl:
  applyFiltersToDrixyRules: false
  severityLevelFilter: 'medium'

# Pull request summary generation options
summary:
  generatePRSummary: true
  behaviourForNewCommits: 'none'
  behaviourForExistingDescription: 'replace'
  customInstructions: ''

# ─────────────────────────────────────────────────────────────
# 4. DRIXY RULES & ORGANIZATIONAL KNOWLEDGE ENGINE
# ─────────────────────────────────────────────────────────────

# Synchronize rules defined in local IDE configuration files (.cursorrules, etc.)
ideRulesSyncEnabled: false

# Automatically synthesize permanent rules from review feedback
drixyRulesGeneratorEnabled: true

# Reviewers whose feedback is excluded from rule generation
drixyLearningExcludedReviewers: []

# Require approval before newly learned rules are activated
drixyKnowledgeApproval:
  enabled: false

# Custom banner and footer notices
customMessages:
  securityNotice: ''
  reviewGuidelines: ''
  complianceNotice: ''
  teamContact: ''

# ─────────────────────────────────────────────────────────────
# 5. SYSTEM PROMPT CALIBRATION & CATEGORY DEFINITIONS
# ─────────────────────────────────────────────────────────────

v2PromptOverrides:
  categories:
    descriptions:
      bug: |
        - Execution breaks: Code throws unhandled exceptions or runtime panics
        - Wrong results: Output does not match expected business logic or functional contracts
        - Resource leaks: Unclosed files, dangling sockets, uncommitted transactions, or memory growth
        - State corruption: Unsynchronized mutations, broken object invariants, or invalid states
        - Logic errors: Control flow produces incorrect branch decisions or unreachable code
        - Race conditions: Concurrent unsynchronized access causing inconsistent state or duplicates
        - Incorrect measurements: Metrics and timings that fail to reflect actual operations
        - Invariant violations: Broken constraints (collection size bounds, uniqueness constraints)
        - Async timing bugs: Variables captured incorrectly across asynchronous closures
        - Conditional validation errors: Truthiness checks on falsy values when membership tests should be used
        - Dead computation: Values computed or transformed but never used downstream
        - Unbounded growth: Collections that accumulate indefinitely within loops without limits
        - Duplicate operations: Identical operations executed sequentially with identical inputs
      performance: |
        - Algorithmic complexity: O(n²) or worse computational paths when O(n) or O(log n) is feasible
        - Redundant operations: Duplicate calculations, repetitive transformations, or avoidable loops
        - Memory waste: Large allocations, avoidable copying, or allocations in hot execution loops
        - Blocking operations: Synchronous I/O or intensive compute in critical request paths
        - Database query pathologies: N+1 query loops, missing indexes, or unconstrained table scans
        - Cache misses: Failure to leverage available in-memory or distributed caching layers
        - Batch processing inefficiency: Failing on first error rather than aggregating batch feedback
      security: |
        - Injection vulnerabilities: SQL, command, NoSQL, LDAP, or template injection vectors
        - Broken authentication & authorization: Missing permission gates, privilege escalation flaws
        - Sensitive data exposure: Credentials, private keys, or PII emitted in logs or responses
        - Insecure cryptography: Broken hash algorithms (MD5/SHA1), static nonces, or hardcoded keys
        - Input validation gaps: Missing sanitization, boundary checks, or integer overflow paths
        - Session management: Predictable session tokens, missing expiration, or insecure cookies
        - Timing attacks: Direct equality comparisons on secrets instead of constant-time comparison
        - Insecure fallback values: Using empty strings or weak defaults when security env vars are absent
        - Input validation bypass: Unchecked pagination limits or negative slice indices
        - Server-Side Request Forgery (SSRF): Unchecked external URLs in network operations
        - Case-sensitivity bypass: Inconsistent normalization in comparisons of domain/email identifiers
  severity:
    flags:
      critical: |
        Application crash/downtime or unrecoverable panic
        Data loss/corruption or state corruption under concurrent access
        Security breach (unauthorized access, privilege escalation, or data exfiltration)
        Critical operation failure (authentication, payment, or authorization)
        Direct financial loss or billing calculation error
        Memory leaks that inevitably exhaust production host resources
        Race conditions causing data loss or security bypass
      high: |
        Important business functionality broken or silently producing wrong results
        Race conditions, TOCTOU bugs, or missing synchronization
        Missing or incorrect locking (e.g. double-checked locking flaws)
        Cache inconsistency or stale data served to users
        Feature flags or configurations that silently disable functionality
        Memory leaks that cause eventual crash under sustained load
        Performance degradation affecting UX under normal operational load
        Security issues with indirect exploitation paths
      medium: |
        Partially broken functionality with workarounds available
        Performance issues in specific edge-case scenarios
        Security weaknesses requiring specific prerequisite conditions to exploit
        Incorrect but recoverable data states
        Non-critical business logic errors
      low: |
        Minor performance overhead with no user-facing impact
        Low-risk security hygiene improvements
        Incorrect metrics or non-critical log messages
        Rare edge-case issues unlikely to occur in production
  level:
    critical: |
      The code WILL crash, lose/corrupt data, or open a severe security breach in production. Immediate fix required before merge.
    issue: |
      The code produces WRONG results or fails to perform its intended function in at least one scenario, but does not cause catastrophic failure.
    warning: |
      The code produces CORRECT results and performs its intended function in ALL scenarios but is suboptimal in style, performance, or maintainability.
  generation:
    main: |
      Detailed and verifiable issue description:
      - Eliminate conversational filler and introductory pleasantries
      - State the problem immediately, followed by the technical cause
      - Use domain-specific terminology (e.g., 'Data race detected in worker pool')
      - Use active voice and concise phrasing (1-2 sentences per issue)
