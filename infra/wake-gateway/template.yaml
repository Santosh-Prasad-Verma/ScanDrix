AWSTemplateFormatVersion: '2010-09-09'
Description: 'ScanDrix Wake-on-Request Serverless Proxy Gateway'

Parameters:
  Ec2InstanceId:
    Type: String
    Default: 'i-07a8af27e8bc5380c'
    Description: 'ID of the ScanDrix backend EC2 instance to wake and proxy'
  Ec2Host:
    Type: String
    Default: '3.107.153.4'
    Description: 'Public IP of the ScanDrix backend EC2 instance'

Resources:
  WakeGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ScanDrixWakeGatewayRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Ec2ControlPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Ec2InstanceId}'

  WakeGatewayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: scandrix-wake-gateway
      Runtime: python3.12
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt WakeGatewayRole.Arn
      Code:
        ZipFile: |
          # Placeholder: actual code in handler.py
          import handler
          def lambda_handler(event, context):
              return handler.lambda_handler(event, context)
      Environment:
        Variables:
          EC2_INSTANCE_ID: !Ref Ec2InstanceId
          EC2_HOST: !Ref Ec2Host
          AWS_REGION: !Ref AWS::Region
          API_PORT: '8080'
          WEBHOOKS_PORT: '8081'

  WakeGatewayFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt WakeGatewayFunction.Arn
      AuthType: NONE

  WakeGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt WakeGatewayFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  FunctionUrl:
    Description: 'Public URL to use for GitHub Webhooks and Frontend API proxy'
    Value: !GetAtt WakeGatewayFunctionUrl.FunctionUrl
