name: "ScanDrix CI: Build & Test Gate"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: "Lint & Race-Detector Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Tests with Race Detector, Coverage & Generate JUnit Report
        run: |
          gotestsum --junitfile junit.xml --format pkgname -- -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-scandrix-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload Test Results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: unittests
          name: codecov-scandrix-test-results
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  compile-binaries:
    name: "Compile All 9 Go Binaries"
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build All 9 Applications
        run: |
          mkdir -p bin
          go build -o bin/scandrix-api ./cmd/api
          go build -o bin/scandrix-server ./cmd/server
          go build -o bin/scandrix-webhooks ./cmd/webhooks
          go build -o bin/scandrix-worker ./cmd/worker
          go build -o bin/scandrix-cli ./cmd/cli
          go build -o bin/scandrix-mcp-manager ./cmd/mcp-manager
          go build -o bin/scandrix-ast-cli ./cmd/ast-cli
          go build -o bin/scandrix-analytics-cli ./cmd/analytics-cli
          go build -o bin/scandrix-try ./cmd/try
          ls -lh bin/
