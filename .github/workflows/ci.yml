name: "ScanDrix CI: Build & Test Gate"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. These workflows check out the repo and run linters,
# tests and image scans; none of them needs write access. Without this the
# workflow inherits the repository default, which is often write-all.
# AUDIT_REMEDIATION.md F-70.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: "Lint & Race-Detector Unit Tests"
    runs-on: ubuntu-latest

    # The audit remediation added database-backed security tests -- RLS
    # enforcement, tenant isolation, token-revocation atomicity, schema drift,
    # SCIM tenant resolution. Without a database in this job every one of them
    # skipped, so the pipeline reported green without ever exercising the
    # tenancy boundary it was written to prove. Same image and credentials as
    # e2e-matrix.yml (F-57).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scandrix_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: scandrix_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway credentials for the ephemeral CI container, not application
      # secrets. Two distinct identities on purpose:
      #
      #   scandrix_test   - owns the schema and runs migrations (superuser)
      #   scandrix_runtime- what the services connect as (NOSUPERUSER,
      #                     NOBYPASSRLS). Four RLS tests deliberately FAIL when
      #                     they detect a superuser connection, because a
      #                     superuser bypasses RLS and would make them vacuous.
      MIGRATION_DATABASE_URL: postgres://scandrix_test:test_password@localhost:5432/scandrix_test_db?sslmode=disable
      SCANDRIX_TEST_DATABASE_URL: postgres://scandrix_test:test_password@localhost:5432/scandrix_test_db?sslmode=disable
      # The billing, auth-session, repository-settings and review-analytics suites
      # read SCANDRIX_ANALYTICS_TEST_DATABASE_URL and skip without it. Those skips
      # hid payment-integrity, entitlement and RLS defects that only a real
      # PostgreSQL exposes, so the name has to be provided here too.
      SCANDRIX_ANALYTICS_TEST_DATABASE_URL: postgres://scandrix_test:test_password@localhost:5432/scandrix_test_db?sslmode=disable
      SCANDRIX_E2E_RUNTIME_DSN: postgres://scandrix_runtime:test_password@localhost:5432/scandrix_test_db?sslmode=disable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Apply Database Migrations
        run: go run ./cmd/migrate migrations

      # Provision the least-privilege role the RLS tests need. The password is
      # set here rather than in the ops script so no credential is committed.
      - name: Provision Least-Privilege Runtime Role
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U scandrix_test -d scandrix_test_db -v ON_ERROR_STOP=1 \
            -f migrations/ops/002_least_privilege_runtime_role.sql
          psql -h localhost -U scandrix_test -d scandrix_test_db -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE scandrix_runtime WITH LOGIN PASSWORD 'test_password'"
          psql -h localhost -U scandrix_test -d scandrix_test_db -tAc \
            "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname='scandrix_runtime'"

      - name: Run Tests with Race Detector, Coverage & Generate JUnit Report
        run: |
          gotestsum --junitfile junit.xml --format pkgname -- -race -covermode=atomic -coverprofile=coverage.out ./...

      # Second coverage pass. `go test -coverprofile` only instruments the
      # package a test binary is built from, so a test in an external `_test`
      # package drives the sibling package and those counters land nowhere.
      # Almost every package here uses external tests, which is why the licensing
      # controllers all reported 0.0% and the Codecov patch gate failed for a
      # diff that was genuinely covered.
      #
      # Re-run each external test package with -coverpkg pointing at the package
      # it drives, then merge. `-coverpkg=./...` in one pass is not a substitute:
      # with several hundred packages every test binary instruments the whole
      # module and the profile comes out truncated and non-reproducible.
      - name: Merge Cross-Package Coverage
        run: |
          set -euo pipefail
          mkdir -p covparts

          # For each directory holding an external _test package, work out which
          # package it exercises: the directory itself when it also contains
          # non-test sources, otherwise its parent. The test binary is then built
          # from the *test* directory and instrumented for the *target* -- these
          # differ for suites kept in their own directory, such as
          # internal/api/controllers/tests driving internal/api/controllers.
          : > covpairs.txt
          for f in $(git ls-files '*_test.go'); do
            pkg=$(grep -m1 '^package ' "$f" | awk '{print $2}')
            case "$pkg" in
              *_test) ;;
              *) continue ;;
            esac
            dir=$(dirname "$f")
            target="$dir"
            if [ -z "$(ls "$dir"/*.go 2>/dev/null | grep -v '_test\.go$')" ]; then
              target="$(dirname "$dir")"
            fi
            [ -n "$(ls "$target"/*.go 2>/dev/null | grep -v '_test\.go$')" ] || continue
            printf '%s\t%s\n' "$dir" "$target"
          done | sort -u > covpairs.txt
          echo "external test packages needing a cross-package pass: $(wc -l < covpairs.txt)"

          mkdir -p covparts
          run_one() {
            testdir="${1%%$'\t'*}"
            target="${1##*$'\t'}"
            out="covparts/$(echo "$testdir" | tr '/' '_').out"
            go test -covermode=atomic -coverpkg="./$target" -coverprofile="$out" "./$testdir" \
              || rm -f "$out"
          }
          export -f run_one
          xargs -a covpairs.txt -d '\n' -I{} -P 4 bash -c 'run_one "$1"' _ {}

          go run ./cmd/covmerge coverage.out covparts/*.out > coverage.merged.out
          mv coverage.merged.out coverage.out
          rm -rf covparts covpairs.txt

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-scandrix-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload Test Results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: unittests
          name: codecov-scandrix-test-results
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  compile-binaries:
    name: "Compile All 9 Go Binaries"
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # Compiles every package, not just the nine binaries.
      #
      # The audit found `go build ./...` failing on internal/review while this
      # job stayed green and /healthz kept answering 200 from a stale image.
      # cmd/api transitively imports internal/review, so this would have caught
      # it -- but nothing ran on the untracked file. `go build ./...` also covers
      # test-only and tooling packages that no cmd imports.
      - name: Compile All Packages
        run: go build ./...

      - name: Build All 9 Applications
        run: |
          mkdir -p bin
          go build -o bin/scandrix-api ./cmd/api
          go build -o bin/scandrix-server ./cmd/server
          go build -o bin/scandrix-webhooks ./cmd/webhooks
          go build -o bin/scandrix-worker ./cmd/worker
          go build -o bin/scandrix-cli ./cmd/cli
          go build -o bin/scandrix-mcp-manager ./cmd/mcp-manager
          go build -o bin/scandrix-ast-cli ./cmd/ast-cli
          go build -o bin/scandrix-analytics-cli ./cmd/analytics-cli
          go build -o bin/scandrix-try ./cmd/try
          ls -lh bin/
