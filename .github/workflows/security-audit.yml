name: "ScanDrix Security: SAST & Supply Chain Audit"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  govulncheck:
    name: "Google Govulncheck Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run Vulnerability Check
        run: govulncheck ./...
        continue-on-error: false

  gosec-sast:
    name: "Gosec AST Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run Gosec SAST Analysis
        run: |
          gosec -severity=high -confidence=high -fmt=sarif -out=gosec-results.sarif -exclude-dir=test ./...

      - name: Upload SARIF Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-security-report
          path: gosec-results.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif
