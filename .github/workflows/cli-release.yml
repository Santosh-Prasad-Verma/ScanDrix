name: "ScanDrix CLI: Cross-Platform Release"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-matrix:
    name: "Cross-Compile CLI Distribution"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: scandrix-cli-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: scandrix-cli-linux-arm64
          - goos: darwin
            goarch: amd64
            output_name: scandrix-cli-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: scandrix-cli-darwin-arm64
          - goos: windows
            goarch: amd64
            output_name: scandrix-cli-windows-amd64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          # Passed via env, not interpolated into run:. A tag containing shell
          # metacharacters would otherwise be substituted into the command
          # line before the shell parsed it. AUDIT_REMEDIATION.md F-69.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # `case`, not `grep -E`: grep is line-oriented and would accept a
          # value whose first line matches.
          case "$REF_NAME" in
            ""|*[!A-Za-z0-9._-]*)
              echo "::error::ref failed validation"
              exit 1
              ;;
          esac
          if [ "${#REF_NAME}" -gt 128 ]; then
            echo "::error::ref too long"
            exit 1
          fi
          go build -ldflags="-s -w -X main.version=$REF_NAME" -o dist/"${{ matrix.output_name }}" ./cmd/cli

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  publish-release:
    name: "Publish GitHub Release & Checksums"
    runs-on: ubuntu-latest
    needs: release-matrix
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Release Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums & SLSA Subjects
        id: hash
        run: |
          cd release-assets
          sha256sum scandrix-cli-* > checksums.txt
          cat checksums.txt
          echo "hashes=$(sha256sum scandrix-cli-* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          name: "ScanDrix CLI ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  provenance:
    name: "Generate Cryptographic SLSA Level 3 Provenance"
    needs: [publish-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.publish-release.outputs.hashes }}"
      upload-assets: true

