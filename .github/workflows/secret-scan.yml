name: "ScanDrix Security: Secret Scanning"

# Master Rule 5.9 — secret scanning in CI as a safety net for anything that
# slips past .gitignore.
#
# Why this exists, concretely: during the 2026-09 website/backend audit a grep
# run against .env printed a live Resend API key and the production Supabase
# database password into a terminal and a chat transcript. Nothing was ever
# committed, so no scanner would have caught it. The fix is two-part: rotate the
# credential, and stop creating a second copy. This workflow is the net for the
# committed case.
#
# Scans the full history rather than only the diff tip, because a secret
# committed once and later removed from HEAD is still in the objects.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * *' # Daily at 03:17 UTC, off the :00 stampede
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# A finding should fail the run loudly but must not abort the whole pipeline
# before the other jobs report.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: "Gitleaks History Scan"
    runs-on: ubuntu-latest
    # Full history on the scheduled/manual runs; the push/PR runs diff against
    # the base so routine work stays fast.
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Required: gitleaks walks commit objects, which a shallow clone
          # omits, and it needs a base commit to diff against.
          fetch-depth: 0

      - name: Scan git history for committed secrets
        id: scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job rather than only annotating.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # v2 expects no args; configuration is the env above plus .gitleaks.toml
          # if present. The defaults catch provider keys, JWTs, private keys and
          # database URLs with inline credentials.

      - name: Explain a finding
        if: steps.scan.outcome == 'failure'
        run: |
          cat <<'EOF'
          A secret was found in this repository's history.

          Do NOT "fix" this by amending the commit. Amending rewrites history
          and leaves the object reachable from any existing clone, reflog or
          fork — the credential stays leaked.

          Do this instead:
            1. Rotate the credential at its provider. This is the only step that
               actually removes the exposure. Treat it as compromised.
            2. Add an allowlist entry in .gitleaks.toml ONLY if the finding is a
               false positive (a documented example, a test fixture). Never
               allowlist a real credential to make the scan go green.
            3. Purge the object from history if the credential was real and
               widely cloned (git filter-repo, then force-push and ask
               collaborators to re-clone).

          Master Rule 1.9: if a secret is ever committed, rotate it at the
          provider immediately. Deleting the line does not remove it from history.
          EOF

  # Defence in depth: assert the files that must never be tracked actually are
  # not. Cheap, catches a .gitignore regression that gitleaks would only notice
  # after a real key landed in one of them.
  gitignore-guard:
    name: "Assert credential files are untracked"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if a credential-bearing file is tracked
        run: |
          # .env.example / .env.sample / .env.template are documentation and are
          # SUPPOSED to be tracked. Excluding them matters: without the negative
          # lookahead this job fails on every push.
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env($|\.(?!example|sample|template|default)[^/]*$)|(^|/)(secrets?|credentials?)(\.[^/]*)?$|\.(pem|key|p12|pfx)$|(^|/)\.npmrc$|(^|/)\.netrc$' \
            || true)
          if [ -n "$tracked" ]; then
            echo "::error::These credential-bearing files are tracked in git:"
            echo "$tracked" | sed 's/^/  - /'
            echo "Remove them with 'git rm --cached <file>' and confirm .gitignore covers them."
            exit 1
          fi
          echo "No credential-bearing files are tracked (documentation templates excluded)."

      - name: Confirm .env.example carries no real values
        run: |
          # A committed .env.example must be names-only. A filled-in value is a
          # leak that reads like documentation, which is the easiest to miss.
          #
          # The previous check only matched values STARTING with a known vendor
          # prefix, so a real high-entropy JWT_SECRET, a long random token, or an
          # inline database password all passed. It now judges the value rather
          # than its prefix, and for connection strings it judges the password
          # component only - otherwise a host like db.example.com looks like a
          # placeholder and hides the credential. AUDIT_REMEDIATION.md F-73.
          if [ ! -f .env.example ]; then
            echo "No .env.example at repo root; skipping."
            exit 0
          fi
          offenders=$(awk '
            /^[[:space:]]*#/ { next }
            {
              line = $0
              key = line; sub(/=.*/, "", key)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key !~ /^[A-Za-z_][A-Za-z0-9_]*$/) next
              if (key !~ /SECRET|PASSWORD|PASSWD|TOKEN|API_KEY|PRIVATE_KEY|CREDENTIAL|ACCESS_KEY|_KEY$|^DATABASE_URL$|^REDIS_URL$|^RABBITMQ_URL$|^MIGRATION_DATABASE_URL$/) next
              if (key ~ /_ALGO$|_ALGORITHM$|_ENABLED$|_DISABLED$|_MODE$|_TTL$|_INTERVAL$|_DAYS$|_PATH$|_FILE$|_SIZE$|_LIMIT$|_ORDER$|_TOPIC$|_ARN$|_NAME$|_ID$|_RETRIES$|_WINDOW$|_THRESHOLD$|_DEPTH$|_WORKERS$|_CONCURRENCY$|_FORMAT$|_LENGTH$|_COUNT$|_PREFIX$|_STRATEGY$|_POLICY$|_TYPE$|_ENV$|_LEVEL$|_PROVIDER$|_SOURCE$|_DRIVER$|_CLASS$|_SCHEME$|_MECHANISM$|_VARIANT$/) next

              val = substr(line, index(line, "=") + 1)
              sub(/[[:space:]]+#.*$/, "", val)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", val)
              gsub(/^"|"$/, "", val); gsub(/^.[A-Z_ -]+.$/, "", val)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", val)
              if (val == "") next

              up = toupper(val)
              if (up ~ /(^|[^A-Z0-9])(REPLACE[A-Z0-9_]*|CHANGE_?ME|CHANGEME|PLACEHOLDER|YOUR[A-Z0-9_-]*|XXXX)([^A-Z0-9]|$)/) next
              if (up ~ /\.\.\./) next
              if (up ~ /^\$\{?[A-Z_]+\}?$/) next
              if (up ~ /<[A-Z_ -]+>/) next
              if (val ~ /\$\{?[A-Za-z_][A-Za-z0-9_]*\}?/) next
              if (val ~ /\[[A-Z_-]+\]/) next

              if (match(val, /:\/\/[^@]*@/)) {
                userinfo = substr(val, RSTART + 3, RLENGTH - 4)
                ci = index(userinfo, ":")
                if (ci > 0) {
                  pw = substr(userinfo, ci + 1)
                  if (pw != "" && length(pw) >= 8 && pw !~ /\[[A-Z_-]+\]/) {
                    if (toupper(pw) !~ /^(REPLACE|CHANGE|CHANGEME|PLACEHOLDER|YOUR|\$)/)
                      print NR ": " key " (inline password in connection string)"
                  }
                }
                next
              }

              if (length(val) < 12 && val !~ /^(sk-|re_|rzp_|whsec_|ghp_|github_pat_|AKIA|ASIA|eyJ|xox[baprs]-)/) next
              print NR ": " key " (value length " length(val) ")"
            }
          ' .env.example)
          if [ -n "$offenders" ]; then
            echo "::error::.env.example contains values that are not placeholders:"
            echo "$offenders" | sed 's/^/  /'
            echo ""
            echo "A names-only .env.example should leave these empty or use an"
            echo "obvious placeholder such as REPLACE_ME."
            exit 1
          fi
          echo ".env.example looks like names-only."
