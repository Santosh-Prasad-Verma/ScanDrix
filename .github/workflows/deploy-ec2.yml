name: "Deploy Backend to AWS EC2"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scandrix-website/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: "Deploy on EC2 Instance"
    runs-on: [ self-hosted, linux ]
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Sync Code & Deploy Docker Containers"
        run: |
          set -e
          echo "🚀 Executing automated deployment directly on EC2..."

          # Sync checked-out repository code to the runtime application directory
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.github' \
            --exclude 'scandrix-website' \
            ./ /home/ubuntu/ScanDrix/

          cd /home/ubuntu/ScanDrix

          # Verify production .env is present
          if [ ! -f ".env" ]; then
            echo "⚠️ Error: .env file missing in /home/ubuntu/ScanDrix!"
            exit 1
          fi

          echo "Building and launching backend containers..."
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

          echo "Pruning dangling build cache images..."
          docker image prune -f

          echo "Waiting for services to initialize..."
          sleep 5
          docker compose -f docker-compose.prod.yml ps

          echo "Verifying API health probe..."
          if wget -qO- --timeout=5 http://localhost:8080/healthz > /dev/null 2>&1; then
            echo "✅ API is online and healthy on port 8080!"
          else
            echo "ℹ️ Containers started. Check logs: 'docker compose -f docker-compose.prod.yml logs scandrix-api'."
          fi

          echo "🎉 Deployment completed successfully!"
