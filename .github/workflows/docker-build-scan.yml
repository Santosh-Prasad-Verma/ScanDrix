name: "ScanDrix Containers: Build Test & Trivy Vulnerability Scan"

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. These workflows check out the repo and run linters,
# tests and image scans; none of them needs write access. Without this the
# workflow inherits the repository default, which is often write-all.
# AUDIT_REMEDIATION.md F-70.
permissions:
  contents: read

jobs:
  build-and-scan:
    name: "Build Container & Scan with Trivy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Vulnerability Scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: scandrix/backend:scan-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Aqua Trivy
        # Pinned to an immutable commit SHA, with the release tag in a trailing
        # comment. The previous ref was `@master`, a mutable branch: whoever
        # controls that branch controls what this workflow runs
        # (AUDIT_REMEDIATION.md F-68).
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: scandrix/backend:scan-test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
