name: "Deploy Staging (ECS Fargate)"

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: staging
  ECS_CLUSTER: scandrix-staging-cluster

jobs:
  test:
    name: "Run Test Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Tests
        run: go test -v ./...

  build-and-deploy:
    name: "Build & Deploy Staging Services"
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: "api"
            dockerfile: "docker/api.Dockerfile"
            ecs_service: "scandrix-staging-api"
          - name: "worker"
            dockerfile: "docker/worker.Dockerfile"
            ecs_service: "scandrix-staging-worker"
          - name: "webhooks"
            dockerfile: "docker/webhooks.Dockerfile"
            ecs_service: "scandrix-staging-webhooks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/scandrix-${{ matrix.service.name }}:staging-${{ steps.vars.outputs.SHA_SHORT }}
            ${{ steps.login-ecr.outputs.registry }}/scandrix-${{ matrix.service.name }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Amazon ECS Fargate
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ matrix.service.ecs_service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
