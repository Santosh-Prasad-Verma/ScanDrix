version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "github-actions"
      - "ci"

  # The root Dockerfile is the one docker-compose builds and
  # docker-build-scan.yml scans, but dependabot only watched /docker, so its
  # base images were never updated. AUDIT_REMEDIATION.md F-72.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "docker"

  # There is no `npm` ecosystem entry here. The dashboard and the website are
  # separate repositories (Santosh-Prasad-Verma/ScanDrix-Dashboard and
  # .../ScanDrix-website), so a `/scandrix-dashboard` directory does not exist
  # in this repository and Dependabot could never open a PR against it. Each
  # frontend carries its own .github/dependabot.yml.

