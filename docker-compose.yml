services:
  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector (Relational Store + 1536-dim HNSW Vector Embeddings)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scandrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scandrix}
      POSTGRES_USER: ${POSTGRES_USER:-scandrix_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scandrix_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scandrix_app} -d ${POSTGRES_DB:-scandrix}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scandrix-network


  # ----------------------------------------------------------------------------
  # RabbitMQ (Quorum Queues, Dead Letter Exchanges, Review Worker Distribution)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: scandrix-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scandrix_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-scandrix_mq_password}
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Web management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # Redis (L2 Cache, Token Bucket Rate Limiting, Monotonic Fencing Locks)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: scandrix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix Database Schema Migrations (Init container, runs once on startup)
  # ----------------------------------------------------------------------------
  scandrix-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-migrate
    restart: "no"
    entrypoint: ["/app/bin/scandrix-migrate", "/app/migrations"]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-scandrix_app}:${POSTGRES_PASSWORD:-scandrix_dev_password}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix REST API Service
  # ----------------------------------------------------------------------------
  scandrix-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-api
    restart: unless-stopped
    entrypoint: ["/app/bin/scandrix-api"]
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-scandrix_app}:${POSTGRES_PASSWORD:-scandrix_dev_password}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-scandrix_admin}:${RABBITMQ_PASSWORD:-scandrix_mq_password}@rabbitmq:5672/
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-scandrix-dev-secret-key-32bytes-min}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - GITLAB_OAUTH_CLIENT_ID=${GITLAB_OAUTH_CLIENT_ID:-}
      - GITLAB_OAUTH_CLIENT_SECRET=${GITLAB_OAUTH_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@scandrix.dev}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - JIRA_CLIENT_ID=${JIRA_CLIENT_ID:-}
      - JIRA_CLIENT_SECRET=${JIRA_CLIENT_SECRET:-}
      - SCANDRIX_ENCRYPTION_KEY=${SCANDRIX_ENCRYPTION_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scandrix-migrate:
        condition: service_completed_successfully
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix Webhooks Ingestion Service (Fire-and-forget, Outbox writes)
  # ----------------------------------------------------------------------------
  scandrix-webhooks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-webhooks
    restart: unless-stopped
    entrypoint: ["/app/bin/scandrix-webhooks"]
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://${POSTGRES_USER:-scandrix_app}:${POSTGRES_PASSWORD:-scandrix_dev_password}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-scandrix_admin}:${RABBITMQ_PASSWORD:-scandrix_mq_password}@rabbitmq:5672/
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-}
      - BITBUCKET_WEBHOOK_SECRET=${BITBUCKET_WEBHOOK_SECRET:-}
      - AZURE_DEVOPS_WEBHOOK_SECRET=${AZURE_DEVOPS_WEBHOOK_SECRET:-}
      - FORGEJO_WEBHOOK_SECRET=${FORGEJO_WEBHOOK_SECRET:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scandrix-migrate:
        condition: service_completed_successfully
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix Review Worker (Pipeline execution, multi-agent debate, suggestion check)
  # ----------------------------------------------------------------------------
  scandrix-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-worker
    restart: unless-stopped
    entrypoint: ["/app/bin/scandrix-worker"]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-scandrix_app}:${POSTGRES_PASSWORD:-scandrix_dev_password}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-scandrix_admin}:${RABBITMQ_PASSWORD:-scandrix_mq_password}@rabbitmq:5672/
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - BEDROCK_AWS_ACCESS_KEY_ID=${BEDROCK_AWS_ACCESS_KEY_ID:-}
      - BEDROCK_AWS_SECRET_ACCESS_KEY=${BEDROCK_AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_AWS_REGION=${BEDROCK_AWS_REGION:-us-east-1}
      - VERTEX_ACCESS_TOKEN=${VERTEX_ACCESS_TOKEN:-}
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://localhost:11434}
      - AI_MODEL_TRIAGE=${AI_MODEL_TRIAGE:-minimax/minimax-m3:free}
      - AI_MODEL_LOGIC=${AI_MODEL_LOGIC:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - AI_MODEL_SECURITY=${AI_MODEL_SECURITY:-stealth/ox-alpha}
      - AI_MODEL_PERF=${AI_MODEL_PERF:-google/gemini-2.5-flash}
      - AI_MODEL_VERIFIER=${AI_MODEL_VERIFIER:-qwen/qwen-2.5-coder-32b-instruct}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - E2B_ENDPOINT=${E2B_ENDPOINT:-}
      - PROOFOFFIX_SANDBOX_ENABLED=${PROOFOFFIX_SANDBOX_ENABLED:-false}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - BITBUCKET_USERNAME=${BITBUCKET_USERNAME:-}
      - BITBUCKET_APP_PASSWORD=${BITBUCKET_APP_PASSWORD:-}
      - SCANDRIX_ENCRYPTION_KEY=${SCANDRIX_ENCRYPTION_KEY:-}
      - PROVENANCE_KEY_PATH=${PROVENANCE_KEY_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      scandrix-migrate:
        condition: service_completed_successfully
    networks:
      - scandrix-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  scandrix-network:
    driver: bridge
