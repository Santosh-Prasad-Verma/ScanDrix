services:
  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector (Relational Store + 1536-dim HNSW Vector Embeddings)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scandrix-postgres
    # AUDIT_REMEDIATION.md F-56: bound resources and drop privileges.
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scandrix}
      POSTGRES_USER: ${POSTGRES_USER:-scandrix_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scandrix_app} -d ${POSTGRES_DB:-scandrix}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scandrix-network


  # ----------------------------------------------------------------------------
  # RabbitMQ (Quorum Queues, Dead Letter Exchanges, Review Worker Distribution)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: scandrix-rabbitmq
    # AUDIT_REMEDIATION.md F-56: bound resources and drop privileges.
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scandrix_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be provided in .env}
    ports:
      # AMQP is reachable from the other compose services by service name, so it
      # does not need a published port at all. Remove both mappings unless you
      # are deliberately debugging the broker from the host.
      # AMQP protocol
      - "127.0.0.1:5672:5672"
      # Management UI, bound to loopback. Publishing this on 0.0.0.0 exposed a
      # full broker admin console to the network, and its credentials were the
      # ones committed in rabbitmq.conf (AUDIT_REMEDIATION.md F-52).
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # Redis (L2 Cache, Token Bucket Rate Limiting, Monotonic Fencing Locks)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: scandrix-redis
    # AUDIT_REMEDIATION.md F-56: bound resources and drop privileges.
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    restart: unless-stopped
    # Redis backs the rate limiters and the account-lockout counter, so an
    # open instance let anyone on the network bypass both. It now requires a
    # password and is published on loopback only. AUDIT_REMEDIATION.md F-54.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be provided in .env}
      - --protected-mode
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be provided in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # PING is answered with NOAUTH without credentials, which used to make
      # an unauthenticated instance look healthy.
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix Database Schema Migrations (Init container, runs once on startup)
  # ----------------------------------------------------------------------------
  scandrix-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-migrate
    # AUDIT_REMEDIATION.md F-56: bound resources and drop privileges.
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    restart: "no"
    entrypoint: ["/app/bin/scandrix-migrate", "/app/migrations"]
    environment:
      # Migrations need CREATE EXTENSION (superuser-only), so the privileged DSN
      # is confined to this one-shot job and never reaches a service container.
      - MIGRATION_DATABASE_URL=postgres://${POSTGRES_USER:-scandrix_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in .env}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable
      - DATABASE_URL=${MIGRATION_DATABASE_URL:-postgres://${POSTGRES_USER:-scandrix_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix REST API Service
  # ----------------------------------------------------------------------------
  scandrix-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-api
    # AUDIT_REMEDIATION.md F-56: bound resources and drop privileges.
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/app/bin/scandrix-api"]
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_RUNTIME_URL:-postgres://${SCANDRIX_RUNTIME_USER:-scandrix_runtime}:${SCANDRIX_RUNTIME_PASSWORD:?SCANDRIX_RUNTIME_PASSWORD must be provided in .env}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-scandrix_admin}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be provided in .env}@rabbitmq:5672/}
      # Appwrite archives review diffs and audit reports. Optional: when unset the
      # orchestrator logs a warning and skips archival (F-63). These were present
      # in .env but never forwarded, so the feature could never work in Compose.
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be provided in .env}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:-}
      - KMS_MASTER_KEY=${KMS_MASTER_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - GITLAB_OAUTH_CLIENT_ID=${GITLAB_OAUTH_CLIENT_ID:-}
      - GITLAB_OAUTH_CLIENT_SECRET=${GITLAB_OAUTH_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@scandrix.dev}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - JIRA_CLIENT_ID=${JIRA_CLIENT_ID:-}
      - JIRA_CLIENT_SECRET=${JIRA_CLIENT_SECRET:-}
      - SCANDRIX_ENCRYPTION_KEY=${SCANDRIX_ENCRYPTION_KEY:-}
    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scandrix-migrate:
        condition: service_completed_successfully
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix Webhooks Ingestion Service (Fire-and-forget, Outbox writes)
  # ----------------------------------------------------------------------------
  scandrix-webhooks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-webhooks
    # AUDIT_REMEDIATION.md F-56: bound resources and drop privileges.
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/app/bin/scandrix-webhooks"]
    environment:
      - PORT=8081
      - DATABASE_URL=${DATABASE_RUNTIME_URL:-postgres://${SCANDRIX_RUNTIME_USER:-scandrix_runtime}:${SCANDRIX_RUNTIME_PASSWORD:?SCANDRIX_RUNTIME_PASSWORD must be provided in .env}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-scandrix_admin}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be provided in .env}@rabbitmq:5672/}
      # Appwrite archives review diffs and audit reports. Optional: when unset the
      # orchestrator logs a warning and skips archival (F-63). These were present
      # in .env but never forwarded, so the feature could never work in Compose.
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-}
      - BITBUCKET_WEBHOOK_SECRET=${BITBUCKET_WEBHOOK_SECRET:-}
      - AZURE_DEVOPS_WEBHOOK_SECRET=${AZURE_DEVOPS_WEBHOOK_SECRET:-}
      - FORGEJO_WEBHOOK_SECRET=${FORGEJO_WEBHOOK_SECRET:-}
    ports:
      - "8081:8081"
    # The shared root Dockerfile hardcodes a HEALTHCHECK against port 8080,
    # which is correct for the API. This service runs on PORT=8081, so that
    # probe always failed and the container sat UNHEALTHY indefinitely
    # (FailingStreak grew without bound) even though /health answered 200.
    # The health endpoint must match the port the process actually listens on.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scandrix-migrate:
        condition: service_completed_successfully
    networks:
      - scandrix-network

  # ----------------------------------------------------------------------------
  # ScanDrix Review Worker (Pipeline execution, multi-agent debate, suggestion check)
  # ----------------------------------------------------------------------------
  scandrix-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scandrix-worker
    # AUDIT_REMEDIATION.md F-56: bound resources and drop privileges.
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/app/bin/scandrix-worker"]
    environment:
      # The worker serves its health probe on 8082, not the image default of 8080.
      - HEALTH_PROBE_PORT=8082
      # Least-privilege. The worker runs as scandrix_runtime (NOSUPERUSER,
      # NOBYPASSRLS) so the RLS policies are actually enforced rather than
      # bypassed. Verified end to end: a review persists the same review row,
      # findings and audit trail under this role as under the owner role.
      - DATABASE_URL=${DATABASE_RUNTIME_URL:-postgres://${SCANDRIX_RUNTIME_USER:-scandrix_runtime}:${SCANDRIX_RUNTIME_PASSWORD:?SCANDRIX_RUNTIME_PASSWORD must be provided in .env}@postgres:5432/${POSTGRES_DB:-scandrix}?sslmode=disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-scandrix_admin}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be provided in .env}@rabbitmq:5672/}
      # Appwrite archives review diffs and audit reports. Optional: when unset the
      # orchestrator logs a warning and skips archival (F-63). These were present
      # in .env but never forwarded, so the feature could never work in Compose.
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - BEDROCK_AWS_ACCESS_KEY_ID=${BEDROCK_AWS_ACCESS_KEY_ID:-}
      - BEDROCK_AWS_SECRET_ACCESS_KEY=${BEDROCK_AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_AWS_REGION=${BEDROCK_AWS_REGION:-us-east-1}
      - VERTEX_ACCESS_TOKEN=${VERTEX_ACCESS_TOKEN:-}
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - AI_MODEL_TRIAGE=${AI_MODEL_TRIAGE:-}
      - AI_MODEL_LOGIC=${AI_MODEL_LOGIC:-}
      - AI_MODEL_SECURITY=${AI_MODEL_SECURITY:-}
      - AI_MODEL_PERF=${AI_MODEL_PERF:-}
      - AI_MODEL_VERIFIER=${AI_MODEL_VERIFIER:-}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - E2B_ENDPOINT=${E2B_ENDPOINT:-}
      - PROOFOFFIX_SANDBOX_ENABLED=${PROOFOFFIX_SANDBOX_ENABLED:-false}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - BITBUCKET_USERNAME=${BITBUCKET_USERNAME:-}
      - BITBUCKET_APP_PASSWORD=${BITBUCKET_APP_PASSWORD:-}
      - SCANDRIX_ENCRYPTION_KEY=${SCANDRIX_ENCRYPTION_KEY:-}
      - PROVENANCE_KEY_PATH=${PROVENANCE_KEY_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      scandrix-migrate:
        condition: service_completed_successfully
    networks:
      - scandrix-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  scandrix-network:
    driver: bridge
